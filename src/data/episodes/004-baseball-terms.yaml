  다음 편은 <b>드라마 스포</b>예요. 아껴뒀던 최종화를 오늘 밤에 보려고 했는데,
  친구 입에서 결말이 먼저 나옵니다. <b>ネタバレやめてよ!</b>라고 막아보지만 이미 늦었어요.
  이럴 때 붙는 <b>〜のに</b> 하나로 억울함이 실립니다.
