no: 4
season: 1
date: 2026-09-11
title: 今[いま]の何[[なに]]?ヒット?
subtitle: 야구는 좋아하는데 룰은 잘 모르는 사람의 관전기
emoji: ⚾🤔
description: 화면에서 방금 벌어진 일을 물을 때 쓰는 일본어. 야구 중계 리액션 표현.
tags: [리액션, 야구]

memoryScene: "야구장 + 방금 뭐였는지 모름 + 병살"

scene:
  - who: 나
    side: a
    jp: ねえ、今[いま]の何[[なに]]?ヒット?
    kr: 야, 방금 뭐야? 안타?
  - who: 친구
    side: b
    jp: ううん、ゲッツー。一気[いっき]に2アウト。
    kr: 아니, 병살. 한 번에 투아웃.
  - who: 나
    side: a
    jp: え、それって最悪[さいあく]じゃない?
    kr: 어, 그거 완전 최악 아냐?
  - who: 친구
    side: b
    jp: まあね。さっきの三振[さんしん]のほうがまだマシだったよ。
    kr: 뭐 그렇지. 차라리 아까 삼진이 나았어.
  - who: 나
    side: a
    jp: 逆転[ぎゃくてん]、まだ間[[ま]]に合[あ]う?
    kr: 역전, 아직 가능해?

wordGroups:
  - label: ⚾ 야구 용어 4
    items:
      - jp: ヒット
        mean: 안타
        note: 영어 hit 그대로. <b>ヒット出[で]た!</b>(안타 나왔다!)로 세트처럼 쓰여요.
      - jp: ゲッツー
        mean: 병살 (더블 플레이)
        note: get two 에서 온 일본식 조어. 정식 명칭은 併殺[へいさつ]지만 중계·일상에선 ゲッツー가 압도적.
      - jp: 三振[さんしん]
        mean: 삼진
        note: <b>三振する</b>로 동사화. 타자 입장에선 아쉬운 결과지만 아웃은 하나뿐.
      - jp: 逆転[ぎゃくてん]
        mean: 역전
        note: <b>逆転する</b> = 역전하다. <b>逆転勝[ぎゃくてんが]ち</b>(역전승)로도 자주 등장.

  - label: 💬 회화 표현
    items:
      - jp: 今[いま]の何[[なに]]?
        mean: 방금 뭐야?
        note: <b>今[いま]の</b>만으로 "방금 그거"가 돼요. 실황 리액션 국룰 표현.
      - jp: ううん
        mean: 아니 (부드러운 부정)
        note: いいえ는 딱딱해요. 친구끼린 <b>ううん</b>, 긍정은 <b>うん</b>!
      - jp: 一気[いっき]に
        mean: 한 번에, 단숨에
        note: 여러 개가 한꺼번에 처리될 때. <b>一気に2アウト</b> = 한꺼번에 투아웃씩이나 / <b>一気に飲[の]む</b> = 원샷하다.
      - jp: それって〜じゃない?
        speak: それってじゃない?
        mean: 그거 ~아냐?
        note: <b>って</b>로 화제를 받고 <b>じゃない?</b>로 동의를 구하는 2단 구조.
      - jp: 最悪[さいあく]
        mean: 최악
        note: 진짜 최악이 아니어도 툭 던지는 리액션어. "헐 완전 최악" 느낌.
      - jp: まあね
        mean: 뭐 그렇지
        note: 100% 동의는 아니고 반쯤 인정할 때. 어른스러운 맞장구.
      - jp: さっきの
        mean: 아까 그
        note: <b>さっきの三振[さんしん]</b> = 아까 그 삼진. <b>今[いま]の</b>와 짝으로 외우기.
      - jp: 〜のほうがまだマシ
        speak: のほうがまだマシ
        mean: 차라리 ~가 낫다
        note: 둘 다 별로인데 그나마 덜 나쁠 때. <b>マシ</b>에는 "썩 좋진 않지만"이 깔려 있어요.
      - jp: まだ
        mean: ① 그나마 ② 아직
        note: 뜻이 두 가지인데 오늘 대화에 둘 다 나와요.<br><b>まだマシ</b> = 그나마 (정도), <b>まだ間[[ま]]に合[あ]う?</b> = 아직 (시간).
      - jp: 間[[ま]]に合[あ]う
        mean: 늦지 않다 / 시간 안에 되다
        note: 마감·막차·역전 모두 여기에. <b>まだ間に合う?</b> 통째로 외우기.

compare:
  - title: 今の何? — 방금 그 상황을 물을 때
    bad:
      mark: ✕
      jp: 今[いま]、何[[なに]]?
    good:
      jp: 今[いま]の何[[なに]]?
    tip: <b>今[いま]、何[[なに]]?</b>는 "지금 뭐 해?"처럼 상대를 향한 질문이 돼요. <b>の</b> 하나만 넣으면 <b>今[いま]の</b> = "방금 그거"라는 명사 덩어리가 돼서 화면 속 상황을 가리켜요. <b>今のすごい!</b> <b>今の見[み]た?</b>도 같은 구조!

  - title: ううん / いいえ — 친구한테 아니라고 할 때
    bad:
      mark: ✕
      jp: いいえ、ゲッツーです。
    good:
      jp: ううん、ゲッツー。
    tip: <b>いいえ</b>는 회의실이나 접객 상황의 부정이에요. 친구가 "안타야?" 하고 물었는데 いいえ라고 하면 갑자기 거리가 확 생겨요. 부드러운 부정은 <b>ううん</b>!

  - title: 一気に / 早く — 순식간에 벌어진 일
    bad:
      mark: ✕
      jp: 早[はや]く2アウト。
    good:
      jp: 一気[いっき]に2アウト。
    tip: <b>早[はや]く</b>는 "빨리 해"처럼 속도를 재촉하는 말이에요. 한 번에 두 개가 처리됐다는 건 <b>一気[いっき]に</b>. <b>一気に片付[かたづ]ける</b>(한 번에 치우다)처럼 써요.

  - title: よりはいい / のほうがまだマシ — 둘 다 맞아요, 뉘앙스가 달라요
    bad:
      mark: △
      jp: 何[[なに]]もしないよりはいい
      aside: 그건 긍정
    good:
      jp: 三振[さんしん]のほうがまだマシ
    tip: <b>よりはいい</b>는 "적어도 저것보단 낫다"며 어느 정도 긍정하는 말, <b>マシ</b>는 "썩 좋진 않지만 덜 나쁘다"는 말이에요. 여기에 <b>まだ</b>(그나마)가 붙으면 아쉬움이 더 살아나요.

  - title: 間に合う / できる — 아직 늦지 않았냐고 물을 때
    bad:
      mark: ✕
      jp: 逆転[ぎゃくてん]、まだできる?
    good:
      jp: 逆転[ぎゃくてん]、まだ間[[ま]]に合[あ]う?
    tip: <b>できる</b>는 "능력상 가능하냐"라서 "역전할 실력이 되냐?"로 들려요. 지금 묻는 건 남은 시간 안에 되느냐니까 <b>間[[ま]]に合[あ]う</b>가 맞아요. <b>終電[しゅうでん]に間に合う</b>(막차 시간 맞추다)와 같은 감각!

apply:
  - situation: 📺 드라마 보다가 놓쳤을 때
    jp: 今[いま]の何[[なに]]?もう一回[いっかい]見[み]たい。
    kr: 방금 뭐야? 한 번 더 보고 싶어.
  - situation: 😴 밤샘 vs 새벽 기상
    jp: 徹夜[てつや]より、早起[はやお]きのほうがまだマシ。
    kr: 밤새우느니 차라리 일찍 일어나는 게 낫지.
  - situation: 🚃 막차 놓칠까 봐
    jp: まだ終電[しゅうでん]に間[[ま]]に合[あ]う?
    kr: 아직 막차 시간 돼?
  - situation: 🧹 주말에 몰아서 집안일
    jp: 洗濯[せんたく]、一気[いっき]に終[お]わらせた。
    kr: 빨래, 한 번에 다 끝냈어.
  - situation: 🙄 반쯤만 동의할 때
    jp: まあね。でも私[わたし]はそう思[おも]わないけど。
    kr: 뭐 그렇지. 근데 난 그렇게 생각 안 하는데.

quiz:
  - q: 화면 속 상황을 보고 "방금 뭐야?"라고 물을 때 맞는 표현은?
    options:
      - label: a)
        jp: 今[いま]、何[[なに]]?
      - label: b)
        jp: 今[いま]の何[[なに]]?
        correct: true
  - q: "친구가 「ヒット?」라고 물었을 때, \"아니, 병살\"이라고 답하는 자연스러운 표현은?"
    options:
      - label: a)
        jp: いいえ、ゲッツー。
      - label: b)
        jp: ううん、ゲッツー。
        correct: true
  - q: "\"한 번에 투아웃\"이라고 할 때 맞는 표현은?"
    options:
      - label: a)
        jp: 早[はや]く2アウト
      - label: b)
        jp: 一気[いっき]に2アウト
        correct: true
  - q: "\"역전, 아직 가능해?\" — 남은 시간 안에 되느냐고 물을 때는?"
    options:
      - label: a)
        jp: 逆転[ぎゃくてん]、まだできる?
      - label: b)
        jp: 逆転[ぎゃくてん]、まだ間[[ま]]に合[あ]う?
        correct: true

