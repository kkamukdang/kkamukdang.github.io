no: 2
date: 2026-08-28
title: 配達[はいたつ]じゃなくて持[も]ち帰[かえ]りになってる!?
subtitle: 치킨 시켜놓고 배달을 포장으로 잘못 누른 날
emoji: 🛵📱
description: 배달앱에서 配達와 持ち帰り를 헷갈렸을 때 쓰는 일본어.
tags: [음식, 실수수습]

recap: 지난 편에서 다이어트 3일차 밤 11시에 결국 치킨을 시켰습니다. 친구가 <b>「明日からまた始めればいいよ</b>」라고 하는 순간 <b>「それだ!」</b> 하고 주문 버튼을 눌렀죠. 그런데 그 주문에 문제가 생겼습니다.

scene:
  - who: 나
    side: a
    jp: 注文[ちゅうもん]したー!
    kr: 주문 완료ー!
  - who: 나
    side: a
    jp: あれ、これ配達[はいたつ]じゃなくて持[も]ち帰[かえ]りになってる!
    kr: 어? 잠깐, 이거 배달이 아니라 포장으로 되어있잖아!
  - who: 친구
    side: b
    jp: え、歩[ある]いて取[と]りに行[い]くの?
    kr: 어? 그럼 걸어가서 직접 가져와야 되는 거야?
  - who: 나
    side: a
    jp: 無理[むり]無理[むり]、パジャマだし店[みせ]まで15分[[ふん]]もかかる…
    kr: 말도 안 돼. 잠옷 입고 있는데 가게까지 15분이나 걸린단 말이야…
  - who: 친구
    side: b
    jp: 電話[でんわ]でキャンセルしてもらえば?
    kr: 전화해서 취소해달라고 해보는 건 어때?
  - who: 나
    side: a
    jp: もうやってる!
    kr: 이미 하고 있어!
  - who: 나
    side: a
    jp: お店[みせ]の人[[ひと]]優[やさ]しくて助[たす]かったー
    kr: 가게 직원분이 친절하셔서 다행이다ー

wordGroups:
  - label: 🍗 배달앱 주문 실전 표현
    items:
      - jp: 持[も]ち帰[かえ]り
        mean: 포장 / 테이크아웃
        note: 배달앱에서 <b>配達</b>와 나란히 붙어 있어서 급하게 누르다 헷갈리기 쉬워요.
      - jp: 配達[はいたつ]
        mean: 배달
        note: <b>持ち帰り</b>와 세트로 등장하는 배달앱 필수 단어.
      - jp: キャンセル
        mean: 취소
        note: 영어 그대로 쓰는 외래어예요. <b>キャンセルする</b> 형태로 동사처럼 씁니다.
      - jp: 取[と]りに行[い]く
        mean: 가지러 가다 / 찾으러 가다
        note: 포장 주문을 직접 받으러 갈 때 쓰는 말이에요. 반대는 <b>届[とど]けてもらう</b>.
      - jp: 無理[むり]
        mean: 무리 / 못 해
        note: 두 번 겹쳐서 <b>無理無理</b>라고 하면 "아니 절대 안 돼" 같은 반사적인 거절이 돼요.
      - jp: 助[たす]かる
        mean: 도움이 되다 / 다행이다
        note: 곤란했던 상황이 해결됐을 때 저절로 나오는 안도의 표현.

  - label: 💬 회화 문법
    items:
      - jp: 〜てもらえば?
        speak: キャンセルしてもらえば?
        mean: ~해달라고 해보는 게 어때?
        note: 상대방에게 부탁을 부드럽게 권할 때 써요. 명령처럼 들리지 않아서 편해요.
      - jp: Aじゃなくて Bになってる
        speak: 配達じゃなくて持ち帰りになってる
        mean: A가 아니라 B로 되어 있다
        note: 내가 의도한 것과 다르게 <b>어느새 그렇게 되어 있는</b> 상태를 발견했을 때 쓰는 패턴.
      - jp: 〜も かかる
        speak: 15分もかかる
        mean: ~나 걸리다
        note: 조사 <b>も</b> 하나로 "생각보다 많이"라는 불만이 실려요. <b>15分かかる</b>는 담담한 사실 전달.

compare:
  - title: 긴 설명 / 짧은 발견 — 실수를 알아챈 순간엔 짧게
    bad:
      mark: △
      jp: 配達[はいたつ]で頼[たの]んだのに店[みせ]で受[う]け取[と]ることになった
      aside: 틀리진 않지만 길고 딱딱해요
    good:
      jp: 配達[はいたつ]じゃなくて持[も]ち帰[かえ]りになってる
    tip: 위 문장도 문법은 맞아요. 다만 당황한 순간에 나오기엔 길어서, 회화에서는 <b>「A じゃなくて B になってる」</b> 쪽이 훨씬 입에 붙어요.

  - title: 〜して! / 〜てもらえば? — 명령 vs 제안
    bad:
      mark: △
      jp: キャンセルして!
      aside: 친구 사이에도 조금 세게 들려요
    good:
      jp: キャンセルしてもらえば?
    tip: 상대가 곤란한 상황일 땐 <b>"~하면 어때?"</b> 쪽이 자연스러워요. 특히 내가 아니라 제3자(가게)에게 부탁하는 일이라면 더 그래요.

  - title: 助ける / 助かる — 도움을 준 쪽 vs 받은 쪽
    bad:
      mark: ✕
      jp: お店[みせ]の人[[ひと]]を助[たす]けた
      aside: 내가 가게 쪽에 도움을 줬다는 뜻이 돼요
    good:
      jp: お店[みせ]の人[[ひと]]のおかげで助[たす]かった
    tip: 내가 도움을 <b>받은</b> 쪽이라면 <b>助かる</b> 를 써요.

apply:
  - situation: 👕 옷 사이즈를 잘못 시켰을 때
    jp: サイズ、交換[こうかん]してもらえば?
    kr: 사이즈 교환해달라고 해보지 그래?
  - situation: 🧊 음료 주문할 때 얼음 빼는 걸 깜빡했을 때
    jp: 氷[こおり]、抜[ぬ]いてもらえば?
    kr: 얼음 빼달라고 해보지 그래?
  - situation: ⏰ 예약 시간을 착각했을 때
    jp: 予約[よやく]、変更[へんこう]してもらえば?
    kr: 예약 시간 바꿔달라고 하면 되지 않을까?
  - situation: 🏠 배송지를 옛날 주소로 넣어버렸을 때
    jp: 住所[じゅうしょ]が前[まえ]の家[いえ]になってる!
    kr: 주소가 예전 집으로 되어 있잖아!

quiz:
  - q: "\"배달이 아니라 포장으로 되어있어!\"를 자연스럽게 말하면?"
    options:
      - label: a)
        jp: 配達[はいたつ]じゃなくて持[も]ち帰[かえ]りになってる
        correct: true
      - label: b)
        jp: 持[も]ち帰[かえ]りじゃなくて配達[はいたつ]になってる
  - q: 친구에게 부드럽게 제안할 때 쓰는 표현은?
    options:
      - label: a)
        jp: キャンセルして!
      - label: b)
        jp: キャンセルしてもらえば?
        correct: true
  - q: "가게 직원분 덕분에 \"다행이었다\"고 말할 때 알맞은 쪽은?"
    options:
      - label: a)
        jp: お店[みせ]の人[[ひと]]を助[たす]けた
      - label: b)
        jp: お店[みせ]の人[[ひと]]のおかげで助[たす]かった
        correct: true
  - q: 「持[も]ち帰[かえ]り」의 뜻은?
    options:
      - label: a)
        jp: 배달
      - label: b)
        jp: 포장 / 테이크아웃
        correct: true

kanjiPractice:
  - w: 配達
    kana: はいたつ
    ko: 배달
    ex: 配達でお願いします。
    exko: 배달로 부탁드립니다.
  - w: 持ち帰り
    kana: もちかえり
    ko: 포장 / 테이크아웃
    ex: 持ち帰りでお願いします。
    exko: 포장으로 부탁드립니다.
  - w: 注文
    kana: ちゅうもん
    ko: 주문
    ex: ご注文はお決まりですか。
    exko: 주문은 정하셨나요?
  - w: 電話
    kana: でんわ
    ko: 전화
    ex: あとで電話しますね。
    exko: 이따가 전화할게요.
  - w: 助かる
    kana: たすかる
    ko: 다행이다 / 도움이 되다
    ex: 本当に助かりました。
    exko: 정말 도움이 됐어요.

keyPoints:
  - 持ち帰り
  - 〜じゃなくて〜になってる
  - 助かる

nextPreview: >-
  다음 편은 <b>야구장 직관</b>입니다. 맥주 사러 간다며 <b>ちょっとビール買ってくる</b> 하고
  자리를 뜬 사이, 하필 만루홈런이 터져요. 여기 붙은 <b>「〜てくる」</b>는 동사 뒤에 붙여
  "~하고 올게"가 되는 표현이에요. 行ってくる처럼 무엇을 하러 가든 쓸 수 있고,
  그냥 간다는 말과 달리 <b>돌아온다</b>는 뜻까지 담깁니다.
