no: 1
date: 2026-08-21
title: 今夜[こんや]チキン頼[たの]んでもいい?
subtitle: 다이어트 3일차, 밤 11시. 배가 고픈 게 아니라 치킨이 고픈 밤.
emoji: 🍗🌙
description: 다이어트 3일차, 밤 11시. 치킨 시켜도 되냐고 묻는 일본어 한 문장.
tags: [음식, 허락구하기, 일상회화]

scene:
  - who: 나
    side: a
    jp: ねえ、今夜[こんや]チキン頼[たの]んでもいいと思[おも]う?
    kr: 있잖아, 오늘 밤 치킨 시켜도 될까?
  - who: 친구
    side: b
    jp: え、ダイエット中[[ちゅう]]じゃなかった?
    kr: 어? 다이어트 중 아니었어?
  - who: 나
    side: a
    jp: そうなんだけど…もう我慢[がまん]できない
    kr: 그렇긴 한데… 더는 못 참겠어
  - who: 친구
    side: b
    jp: 明日[あした]からまた始[はじ]めればいいよ(笑[わら])
    kr: 내일부터 다시 시작하면 되지 ㅋㅋ
  - who: 나
    side: a
    jp: それだ! 今[いま]すぐ頼[たの]む!
    kr: 콜! 지금 바로 시킨다!

wordGroups:
  - label: 🍗 야식 실전 표현
    items:
      - jp: 頼[たの]む
        mean: 주문하다 · 부탁하다
        note: 음식 시킬 때 <b>「頼んでもいい?」</b> 형태로 자주 써요.
      - jp: 今夜[こんや]
        mean: 오늘 밤
        note: 今晩(こんばん)과 뜻은 같지만, 톡에서는 <b>今夜</b>가 짧아서 편해요.
      - jp: ダイエット中[[ちゅう]]
        mean: 다이어트 중
        note: 일본어 ダイエット는 체중 감량뿐 아니라 식단 조절·건강 관리를 아우르는 넓은 개념으로 쓰여요.
      - jp: 我慢[がまん]
        mean: 참음 · 인내
        note: 먹고 싶은 것, 졸음, 화장실까지 — <b>참는 상황 전반</b>에 두루 써요.
      - jp: 今[いま]すぐ
        mean: 지금 바로 · 당장
        note: 今(지금)보다 급한 느낌. 결심하고 바로 실행에 옮길 때 붙여요.
      - jp: それだ!
        mean: 그래, 바로 그거야!
        note: 딱 맞아떨어질 때 나오는 감탄사. 한국어로는 <b>"콜!"</b> 쪽이 더 가까워요.

  - label: 💬 회화 문법
    items:
      - jp: 〜て(で)もいい?
        speak: でもいい?
        mean: ~해도 돼?
        note: >-
          허락을 구하는 표현. て와 で는 따로 외우는 게 아니라 <b>앞 동사의 て형이 정해줘요.</b><br>
          예) 食[た]べる → 食[た]べ<b>て</b>もいい? / 頼[たの]む → 頼[たの]<b>んで</b>もいい?
      - jp: 〜中[[ちゅう]]
        speak: ちゅう
        mean: ~하는 중
        note: 명사 뒤에 바로 붙여 진행 상태를 나타내요. 仕事中, 会議中처럼요.
      - jp: 〜できない
        speak: できない
        mean: ~할 수 없다
        note: する동사의 가능형 부정. <b>의지가 아니라 한계</b>를 말할 때 써요.<br>する → できる → できない
      - jp: 〜ばいいよ
        speak: ばいいよ
        mean: ~하면 돼
        note: 부담 없이 가볍게 조언할 때. 위로처럼 들리는 말투예요.

compare:
  - title: 頼む / 注文する — 친구한테는 頼む 쪽이 편해요
    bad:
      mark: △
      jp: チキン注文[ちゅうもん]してもいい?
      aside: 살짝 딱딱한 느낌
    good:
      jp: チキン頼[たの]んでもいい?
    tip: 둘 다 맞는 말이에요. 다만 <b>注文する</b>는 배달앱 화면이나 가게 안내문에서 더 자주 보이고, 친구끼리 톡할 때는 <b>頼む</b> 쪽이 자연스러워요.

  - title: 〜中 — 앞에 오는 건 보통 명사예요
    bad:
      mark: ✕
      jp: ダイエットしてる中[[ちゅう]]じゃなかった?
    good:
      jp: ダイエット中[[ちゅう]]じゃなかった?
    tip: <b>「〜中」</b>는 명사 뒤에 바로 붙어요. 동사 뒤에 붙이면 잘 안 쓰는 형태라 어색하게 들려요.

  - title: 我慢しない / 我慢できない — 의지냐 한계냐
    bad:
      mark: △
      jp: 我慢[がまん]しない!
      aside: "\"안 참을래\"라는 의지로 들려요"
    good:
      jp: 我慢[がまん]できない!
    tip: 문법은 둘 다 맞아요. 하지만 <b>〜ない</b>는 "안 한다"는 선택, <b>〜できない</b>는 "못 하겠다"는 한계라서 뜻이 달라져요.

  - title: 始まる / 始める — 내가 하는 일이면 始める
    bad:
      mark: △
      jp: 明日[あした]からまた始[はじ]まればいいよ
      aside: "\"저절로 시작되면 좋겠다\"로 들려요"
    good:
      jp: 明日[あした]からまた始[はじ]めればいいよ
    tip: <b>始まる</b>는 저절로 시작되는 것(자동사), <b>始める</b>는 내가 시작하는 것(타동사)이에요. 다이어트는 내가 하는 거니까 始める 쪽이 맞아요.

apply:
  - situation: ☕ 커피를 못 참겠을 때
    jp: コーヒー、我慢[がまん]できない…
    kr: 커피, 못 참겠어…
  - situation: 🏃 운동을 내일로 미룰 때
    jp: 運動[うんどう]も明日[あした]から始[はじ]めればいいよ
    kr: 운동도 내일부터 시작하면 돼
  - situation: 🍶 술 마셔도 되는지 물어볼 때
    jp: 今夜[こんや]お酒[さけ]飲[の]んでもいいと思[おも]う?
    kr: 오늘 밤 술 마셔도 될까?
  - situation: 😂 결심이 또 무너졌을 때
    jp: また我慢[がまん]できなかった(笑[わら])
    kr: 또 못 참았어 ㅋㅋ

quiz:
  - q: 친구에게 "치킨 시켜도 돼?"라고 톡할 때 더 자연스러운 쪽은?
    options:
      - label: a)
        jp: チキン頼[たの]んでもいい?
        correct: true
      - label: b)
        jp: チキンお願[ねが]いしてもいい?
  - q: "\"(더는) 못 참겠어!\"에 어울리는 표현은?"
    options:
      - label: a)
        jp: 我慢[がまん]しない!
      - label: b)
        jp: 我慢[がまん]できない!
        correct: true
  - q: 빈칸에 알맞은 것은? 「明日[あした]からまた( )ばいいよ」
    options:
      - label: a)
        jp: 始[はじ]まれ
      - label: b)
        jp: 始[はじ]めれ
        correct: true
  - q: 「ダイエット中[[ちゅう]]」처럼 「〜中」 앞에 오는 것은?
    options:
      - label: a)
        jp: 동사 (してる)
      - label: b)
        jp: 명사 (ダイエット)
        correct: true

kanjiPractice:
  - w: 注文
    kana: ちゅうもん
    ko: 주문
    ex: ご注文はお決まりですか。
    exko: 주문은 정하셨나요?
  - w: 配達
    kana: はいたつ
    ko: 배달
    ex: 配達でお願いします。
    exko: 배달로 부탁드립니다.
  - w: 持ち帰り
    kana: もちかえり
    ko: 포장 / 테이크아웃
    ex: 持ち帰りでお願いします。
    exko: 포장으로 부탁드립니다.
  - w: 電話
    kana: でんわ
    ko: 전화
    ex: あとで電話しますね。
    exko: 이따가 전화할게요.
  - w: 助かる
    kana: たすかる
    ko: 다행이다 / 도움이 되다
    ex: 本当に助かりました。
    exko: 정말 도움이 됐어요.

keyPoints:
  - 頼[たの]んでもいい?
  - 我慢[がまん]できない
  - 始[はじ]めればいいよ

nextPreview: >-
  치킨은 무사히 시켰는데, 다음 편에서 사고가 납니다. 주문 완료 화면을 보니 <b>配達</b>가 아니라
  <b>持[も]ち帰[かえ]り</b>로 되어 있어요. 잠옷 차림에 가게까지는 걸어서 15분.
  이럴 때 친구가 건네는 한마디가 <b>「キャンセルしてもらえば?」</b>예요.
