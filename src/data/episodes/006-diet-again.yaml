no: 6
season: 1
date: 2026-09-25
title: また明日[[あした]]から
subtitle: 체중계에 올라갔다 내려왔다, 그리고 또 그 말
emoji: ⚖️🍗
description: 미루는 말을 하는 일본어. また明日から, 今回はマジで, とりあえず.
tags: [거절·미루기, 음식]

memoryScene: "체중계 + 6주 전에도 했던 말 + 결국 치킨"

scene:
  - who: 나
    side: a
    jp: やっぱり、また明日[[あした]]から。
    kr: 역시, 또 내일부터.
  - who: 친구
    side: b
    jp: それ、6週間前[しゅうかんまえ]も言[い]ってたよね。
    kr: 그거, 6주 전에도 말했잖아.
  - who: 나
    side: a
    jp: 今回[こんかい]はマジで。ほんとだって。
    kr: 이번엔 진짜로. 진짜라니까.
  - who: 친구
    side: b
    jp: はいはい(笑[わら])明日[[あした]]からまた始[はじ]めればいいよ。
    kr: 네네 ㅋㅋ 내일부터 다시 시작하면 되지 뭐.
  - who: 나
    side: a
    jp: …とりあえず、今夜[こんや]チキン頼[たの]んでもいい?
    kr: …일단, 오늘 밤 치킨 시켜도 돼?

wordGroups:
  - label: ⚖️ 다시 결심하는 밤의 실전 표현
    items:
      - jp: やっぱり
        mean: 역시
        note: 예상대로일 때. 이렇게 <b>자기 자신에게 하는 혼잣말</b>로도 자주 씁니다.
      - jp: 週間[しゅうかん]
        mean: ~주간, 주
        note: 숫자를 앞에 붙여 기간을 셉니다. <b>2週間</b> = 2주간.
      - jp: マジ
        mean: 진짜, 진심
        note: 친구 사이 캐주얼 표현. <b>マジで</b> 형태로 부사처럼 씁니다.
      - jp: はいはい
        mean: 네네
        note: 두 번 겹치면 반쯤 흘려듣는 맞장구가 됩니다.
      - jp: とりあえず
        mean: 일단, 우선
        note: 나중 일은 미뤄두고 지금 할 것부터 정할 때.

  - label: 💬 회화 문법
    items:
      - jp: また〜から
        speak: また明日から
        mean: 또 ~부터
        note: <b>また明日から</b> = 또 내일부터. <b>また</b>가 붙는 순간 처음이 아니라는 자백이 됩니다.
      - jp: 〜てた
        speak: 言ってた
        mean: ~했었다
        note: <b>〜ていた</b>의 회화 축약형. 과거에 계속·반복된 일. <b>言ってたよね</b> = 말했었잖아.
      - jp: 〜だって
        speak: ほんとだって
        mean: ~라니까
        note: 안 믿어주는 상대에게 우길 때. <b>ほんとだって</b> = 진짜라니까.
      - jp: 〜ばいい
        speak: 始めればいい
        mean: ~하면 된다
        note: 해결책을 제시하는 형태. <b>始めればいい</b> = 시작하면 된다.
      - jp: 〜てもいい?
        speak: 頼んでもいい?
        mean: ~해도 돼?
        note: 허락을 구합니다. <b>이 시리즈의 첫 편</b>에서 이미 만난 표현이에요.

compare:
  - title: 本当に / マジで — 친구 사이의 톤
    bad:
      mark: △
      jp: 今回[こんかい]は本当[ほんとう]に。
      aside: 조금 격식 있게 들려요
    good:
      jp: 今回[こんかい]はマジで。
    tip: <b>マジで</b>는 캐주얼한 자리 전용이에요. 상사나 처음 만난 사람에게는 <b>本当に</b> 쪽이 안전합니다.

  - title: はい / はいはい — 두 번 겹치면 뜻이 바뀝니다
    bad:
      mark: △
      jp: はい。
      aside: 진지하게 받아들이는 대답
    good:
      jp: はいはい(笑[わら])
    tip: 겹치는 것만으로 <b>믿지 않는다</b>는 뉘앙스가 생겨요. 다만 윗사람에게는 무례하게 들릴 수 있으니 친구 사이에서만.

  - title: 言った / 言ってた — 한 번이냐, 그러고 다녔냐
    bad:
      mark: △
      jp: 6週間前[しゅうかんまえ]も言[い]った。
      aside: 그때 한 번 말했다는 사실 전달
    good:
      jp: 6週間前[しゅうかんまえ]も言[い]ってたよね。
    tip: <b>〜てた</b>는 과거에 계속·반복된 상태예요. 여기에 <b>よね</b>가 붙으면서 '너도 기억하지?' 하고 확인하는 압박이 됩니다.

  - title: ほんとに / ほんとだって — 안 믿어줄 때
    bad:
      mark: △
      jp: ほんとに。
      aside: 담담한 강조
    good:
      jp: ほんとだって。
    tip: <b>〜だって</b>가 붙으면 '내 말 좀 믿어'가 실려요. 상대가 안 믿는 게 뻔한 상황에서는 이쪽입니다.

  - title: また 자리 — 붙이면 자백이 됩니다
    bad:
      mark: △
      jp: 明日[[あした]]から。
      aside: 처음 결심한 사람의 말
    good:
      jp: また明日[[あした]]から。
    tip: 둘 다 맞는 문장인데 화자의 처지가 달라요. 이 편의 제목에 <b>また</b>가 들어간 이유이기도 합니다.

  - title: "とりあえず / 一応 — 우리말로는 둘 다 '일단'"
    bad:
      mark: △
      jp: 一応[いちおう]ビール。
      aside: "'혹시 몰라서, 형식상' 쪽이라 술자리에서는 어색해요"
    good:
      jp: とりあえずビール。
    tip: <b>とりあえず</b>는 순서상 먼저, <b>一応</b>은 만약을 대비해서. 헷갈리기 쉬운 지점이에요.

apply:
  - situation: 🏃 오늘도 운동화를 안 신었을 때
    jp: 運動[うんどう]はまた明日[[あした]]から。
    kr: 운동은 또 내일부터.
  - situation: 📚 이번 주도 책을 안 폈을 때
    jp: 勉強[べんきょう]、また来週[らいしゅう]から。
    kr: 공부는 또 다음 주부터.
  - situation: 🍺 술집에 앉자마자
    jp: とりあえずビール。
    kr: 일단 맥주.
  - situation: 🛋 뭘 할지 아직 안 정했을 때
    jp: とりあえず座[すわ]ろっか。
    kr: 일단 앉을까.
  - situation: 😤 아무리 말해도 안 믿어줄 때
    jp: 違[ちが]うって。ほんとだって。
    kr: 아니라니까. 진짜라니까.

