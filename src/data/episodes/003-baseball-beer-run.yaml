no: 3
season: 1
date: 2026-09-04
title: ちょっとビール買[か]ってくる
subtitle: 야구장 직관, 하필 자리 비운 그 순간
emoji: ⚾🍺
description: 자리를 뜨며 "사올게"라고 말하는 일본어, 그리고 징크스를 말하는 법.
tags: [부탁하기, 야구]

memoryScene: "야구장 + 맥주 사러 간 사이 + 만루홈런"


scene:
  - who: 나
    side: a
    jp: ちょっとビール買[か]ってくる。
    kr: 나 맥주 좀 사올게.
  - who: 나
    side: a
    jp: 何[[なに]]かいる?
    kr: 뭐 필요한 거 있어?
  - who: 친구
    side: b
    jp: じゃあ、からあげお願[ねが]い!
    kr: 그럼 가라아게 좀!
  - who: 나
    side: a
    jp: …え、今[いま]の歓声[かんせい]なに?
    kr: …어? 방금 그 함성 뭐야?
  - who: 친구
    side: b
    jp: 満塁[まんるい]ホームラン。
    kr: 만루홈런.
  - who: 친구
    side: b
    jp: ちょうど席[せき]立[た]った時[とき]。
    kr: 딱 너 자리 뜬 그 타이밍에.
  - who: 나
    side: a
    jp: 私[わたし]が離[はな]れると必[かなら]ず点[てん]入[はい]るんだよね…
    kr: 내가 자리만 비우면 꼭 점수 나더라…

wordGroups:
  - label: ⚾ 야구장 직관 실전 표현
    items:
      - jp: 何[[なに]]かいる?
        mean: 뭐 필요한 거 있어?
        note: 여기서 いる는 "있다"가 아니라 <b>"필요하다"</b>예요. 통째로 외워두면 편해요.
      - jp: お願[ねが]い!
        mean: 좀 부탁해! / ~로 해줘!
        note: 뒤에 동사 없이 명사만 붙여도 완성돼요. <b>からあげお願い</b> = 가라아게 좀!
      - jp: 歓声[かんせい]
        mean: 함성
        note: 경기장·공연장 특유의 "와아—" 하는 소리.
      - jp: 満塁[まんるい]ホームラン
        mean: 만루홈런
        note: 야구 중계 단골 표현이라 세트로 외우면 편해요.
      - jp: 席[せき]を立[た]つ
        mean: 자리를 뜨다
        note: <b>席立った時</b>처럼 を를 빼는 쪽이 구어체에서는 더 자연스러워요.

  - label: 💬 회화 문법
    items:
      - jp: 〜てくる
        speak: 買ってくる
        mean: ~하고 오다 / ~해 올게
        note: 잠깐 나갔다가 <b>돌아온다</b>는 뉘앙스라 자리를 비울 때 꼭 필요해요.
      - jp: ちょうど〜時[とき]
        speak: ちょうど席立った時
        mean: 딱 ~할 때
        note: <b>ちょうど</b> = 하필, 마침, 딱.
      - jp: 〜と必[かなら]ず〜
        speak: 離れると必ず点入る
        mean: ~하면 꼭 ~해
        note: 한 번이 아니라 <b>매번 반복되는</b> 징크스나 법칙을 말할 때 써요.
      - jp: 〜んだよね
        speak: 点入るんだよね
        mean: ~하더라 / ~하단 말이지
        note: 혼잣말에 공감을 살짝 얹는 어미예요. 빼면 담담한 설명문이 돼요.

compare:
  - title: 必要? / いる? — 필요하냐고 물을 때
    bad:
      mark: △
      jp: 何[[なに]]か必要[ひつよう]?
      aside: 사무적으로 들려요
    good:
      jp: 何[[なに]]かいる?
    tip: <b>必要</b>는 "서류 필요하세요?" 같은 공적이거나 정중한 상황에 어울려요. 친구끼리는 <b>何かいる?</b> 쪽이 자연스러워요.

  - title: 買いに行く / 買ってくる — 가는 것 vs 갔다 오는 것
    bad:
      mark: △
      jp: ちょっとビール買[か]いに行[い]く。
      aside: 돌아온다는 뜻이 빠져요
    good:
      jp: ちょっとビール買[か]ってくる。
    tip: <b>買いに行く</b>는 "사러 간다"까지만이에요. <b>「〜てくる」</b>를 붙여야 갔다가 돌아온다는 뜻이 살아요.

  - title: お願いします / お願い! — 친구 사이의 부탁 톤
    bad:
      mark: △
      jp: からあげをお願[ねが]いします。
      aside: 친구에게는 거리감이 생겨요
    good:
      jp: からあげお願[ねが]い!
    tip: 문법은 맞지만 너무 정중해요. を도 빼고 します도 빼면 딱 친구 톤이 돼요. 가게 점원에게는 <b>お願いします</b> 쪽이 맞아요.

  - title: 〜たら / 〜と — 징크스를 말할 때
    bad:
      mark: △
      jp: 私[わたし]が離[はな]れたら必[かなら]ず点[てん]入[はい]る。
      aside: 일회성 가정처럼 들려요
    good:
      jp: 私[わたし]が離[はな]れると必[かなら]ず点[てん]入[はい]る。
    tip: <b>たら</b>는 "만약 ~하면"에 가깝고, <b>と</b>는 "~하기만 하면 늘"이에요. 매번 그런다는 징크스 얘기라면 と 쪽이 자연스러워요.

  - title: 〜んだよね — 붙이고 안 붙이고의 차이
    bad:
      mark: △
      jp: 点[てん]入[はい]る。
      aside: 건조한 설명문 느낌
    good:
      jp: 点[てん]入[はい]るんだよね…
    tip: 위 문장도 문법상 맞아요. 다만 <b>んだよね</b>를 붙이면 "…그렇더라고~" 하는 억울함이 실려요. 04번과 세트로 기억해 두세요.

apply:
  - situation: ☕ 카페에서 자리 뜨며
    jp: コンビニ行[い]ってくる。何[[なに]]かいる?
    kr: 편의점 갔다 올게. 뭐 필요한 거 있어?
  - situation: 🍿 매점 가는 친구에게 부탁할 때
    jp: じゃあ、ポップコーンお願[ねが]い!
    kr: 그럼 팝콘 좀!
  - situation: 🚻 하필 그 순간
    jp: ちょうどトイレ行[い]った時[とき]に決[き]まったの?
    kr: 딱 화장실 간 사이에 (골) 들어간 거야?
  - situation: 😵 나만 그런 징크스
    jp: 私[わたし]が見[み]ると必[かなら]ず負[ま]けるんだよね…
    kr: 내가 보기만 하면 꼭 지더라…

