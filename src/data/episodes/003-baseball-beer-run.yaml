        correct: true
  - q: 친구에게 가라아게를 부탁할 때 가장 자연스러운 톤은?
    options:
      - label: a)
        jp: からあげをお願[ねが]いします。
      - label: b)
        jp: からあげお願[ねが]い!
        correct: true

