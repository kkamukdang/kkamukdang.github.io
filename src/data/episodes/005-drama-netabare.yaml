no: 5
season: 1
date: 2026-09-18
title: まだ見[み]てないのに!
subtitle: 아껴뒀던 최종화, 친구 입에서 먼저 나왔다
emoji: 📺🙉
description: 스포를 당했을 때 쓰는 일본어. 억울함을 담는 〜のに와 실수를 인정하는 〜ちゃった.
tags: [실수 수습, 드라마]

memoryScene: "아껴둔 최종화 + 친구의 스포 + 못 들은 걸로"

scene:
  - who: 나
    side: a
    jp: ねえ、あのドラマの最終回[さいしゅうかい]、見[み]た?
    kr: 야, 그 드라마 최종화 봤어?
  - who: 친구
    side: b
    jp: 見[み]た見[み]た!最後[さいご]さ、犯人[はんにん]が実[じつ]はお兄[にい]さんだったんだよ!
    kr: 봤지 봤지! 마지막에 있잖아, 범인이 알고 보니 오빠였어!
  - who: 나
    side: a
    jp: えっ、ちょっと!ネタバレやめてよ!まだ見[み]てないのに!
    kr: 야 잠깐! 스포 하지 마! 나 아직 안 봤단 말이야!
  - who: 친구
    side: b
    jp: あ…ごめん、うっかり言[い]っちゃった。
    kr: 아… 미안, 나도 모르게 말해버렸다.
  - who: 나
    side: a
    jp: 今[いま]の、聞[き]かなかったことにする。
    kr: 방금 건, 못 들은 걸로 할래.

wordGroups:
  - label: 📺 드라마 이야기 실전 표현
    items:
      - jp: ネタバレ
        mean: 스포일러
        note: ネタ(내용) + バレる(들통나다). <b>ネタバレやめて</b> 통째로 외우면 바로 씁니다.
      - jp: 最終回[さいしゅうかい]
        mean: 최종화, 마지막 회
        note: 드라마·애니의 마지막 편. 1화는 <b>第一話[だいいちわ]</b>.
      - jp: 犯人[はんにん]
        mean: 범인
        note: 미스터리물 이야기에 빠지지 않는 단어. 스포의 8할이 여기서 나옵니다.
      - jp: 実[じつ]は
        mean: 사실은, 알고 보니
        note: 반전을 꺼낼 때. <b>実は〜だった</b> 형태로 자주 붙습니다.
      - jp: うっかり
        mean: 무심코, 깜빡하고
        note: 실수를 인정하는 부사. 뒤에 거의 항상 <b>〜ちゃった</b>가 따라옵니다.
      - jp: ちょっと!
        mean: 야! 잠깐!
        note: 사전 뜻은 '조금'이지만, 이렇게 혼자 세게 던지면 <b>제지하는 말</b>이 됩니다.

  - label: 💬 회화 문법
    items:
      - jp: 〜ちゃった
        speak: ちゃった
        mean: ~해버렸다
        note: <b>〜てしまった</b>의 회화 축약형. 후회·실수에 씁니다.<br>言う → 言っちゃった / 食べる → 食べちゃった.
      - jp: まだ〜てない
        speak: まだ見てない
        mean: 아직 ~ 안 했다
        note: <b>まだ見てない</b> = 아직 안 봤다. 반말에서는 <b>〜ていない</b>의 い가 빠집니다.
      - jp: 〜のに
        speak: のに
        mean: ~는데 (억울함)
        note: 문장 끝에 붙여 항의·서운함을 냅니다. <b>のに</b>가 없으면 그냥 사실 전달이에요.
      - jp: 〜んだよ
        speak: んだよ
        mean: ~거든, ~란 말이야
        note: 새 정보를 알려줄 때. 친구가 신나서 떠드는 톤이 여기서 나옵니다.

  - label: 🙉 오늘의 마무리 한마디
    items:
      - jp: 聞[き]かなかったことにする
        mean: 못 들은 걸로 하다
        note: 문법을 뜯지 말고 <b>덩어리 하나</b>로 외우세요. <b>見なかったことにする</b>(못 본 걸로 하다)로도 그대로 씁니다.

compare:
  - title: 言った / 言っちゃった — 사실 전달이냐, 후회냐
    bad:
      mark: △
      jp: あ、ごめん、言[い]った。
      aside: "\"말했어\"라 사과가 되지 않아요"
    good:
      jp: あ、ごめん、言[い]っちゃった。
    tip: <b>〜ちゃった</b>는 '안 그러려고 했는데 그렇게 됐다'는 감정을 얹어줘요. 사과하는 자리에는 이쪽이 자연스럽습니다.

  - title: まだ見てない / まだ見てないのに — のに가 붙어야 항의가 됩니다
    bad:
      mark: △
      jp: まだ見[み]てない。
      aside: 담담한 정보 전달
    good:
      jp: まだ見[み]てないのに!
    tip: 스포를 당한 상황에서 앞 문장만 말하면 억울함이 전해지지 않아요. 끝에 <b>のに</b> 하나로 톤이 확 바뀝니다.

  - title: しないでください / やめて — 친구 사이라면
    bad:
      mark: △
      jp: ネタバレしないでください。
      aside: 정중해서 거리감이 생겨요
    good:
      jp: ネタバレやめてよ!
    tip: <b>やめて</b>는 이미 시작된 걸 멈추라는 말이라 이 장면에 더 맞아요. 끝에 <b>よ</b>를 붙이면 항의 느낌이 세집니다.

  - title: 見なかった / 見てない — まだ와 짝을 이루는 형태
    bad:
      mark: ✕
      jp: まだ見[み]なかったのに!
    good:
      jp: まだ見[み]てないのに!
    tip: <b>見なかった</b>는 '(그때) 안 봤다'로 끝난 과거예요. 지금도 안 본 상태는 언제나 <b>〜てない</b>. 한국어 '안 봤어'가 둘 다로 번역돼서 헷갈리기 쉬운 지점입니다.

  - title: うっかり 자리 — 부사는 동사 앞에
    bad:
      mark: △
      jp: 言[い]っちゃった、うっかり。
    good:
      jp: うっかり言[い]っちゃった。
    tip: 회화에서 어순을 뒤집는 경우도 있지만, 사과하는 장면에서는 앞에 두는 쪽이 안전해요.

apply:
  - situation: 🍰 냉장고에 남은 걸 먹어버렸을 때
    jp: 最後[さいご]の一個[いっこ]、食[た]べちゃった。
    kr: 마지막 하나, 먹어버렸어.
  - situation: 😱 눈 떠보니 이미 늦었을 때
    jp: 寝坊[ねぼう]しちゃった!
    kr: 늦잠 자버렸어!
  - situation: 📦 결제도 안 했는데 물건이 왔을 때
    jp: まだ払[はら]ってないのに、届[とど]いた。
    kr: 아직 결제도 안 했는데 도착했어.
  - situation: 🍜 아직 먹는 중인데 그릇을 치웠을 때
    jp: まだ食[た]べてないのに、下[[さ]]げられちゃった。
    kr: 아직 다 안 먹었는데 치워버리더라.
  - situation: 😅 방금 한 말을 도로 넣고 싶을 때
    jp: さっきの話[はなし]、なかったことにして。
    kr: 아까 그 얘기, 없던 걸로 해줘.

quiz:
  - q: 친구가 드라마 결말을 말해버렸다. 스포 하지 말라고 막을 때는?
    options:
      - label: a)
        jp: ネタバレしないでください
      - label: b)
        jp: ネタバレやめて!
        correct: true
  - q: "\"아, 미안. 나도 모르게 말해버렸다.\""
    options:
      - label: a)
        jp: あ、ごめん、うっかり言[い]っちゃった。
        correct: true
      - label: b)
        jp: あ、ごめん、うっかり言[い]った。
  - q: "\"나 아직 안 봤단 말이야!\" 억울함을 담으려면?"
    options:
      - label: a)
        jp: まだ見[み]てない。
      - label: b)
        jp: まだ見[み]てないのに!
        correct: true
  - q: まだ 와 짝을 이루는 형태는?
    options:
      - label: a)
        jp: まだ見[み]なかったのに!
      - label: b)
        jp: まだ見[み]てないのに!
        correct: true

